services:
  - type: web
    name: minimart-pos
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: |
      npm ci
      npm --prefix frontend ci && npm --prefix frontend run build
      npm --prefix frontend-hrms ci && npm --prefix frontend-hrms run build
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTO_SETUP
        value: "true"
      - key: DB_DIALECT
        value: sqlite
      - key: DB_STORAGE
        value: ./database.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      # PayMongo (optional - only needed for online payments).
      # Set these in the Render dashboard as encrypted secrets, or uncomment and
      # fill them in. Do NOT commit real keys here.
      #
      # PAYMONGO_WEBHOOK_SECRET is the one that is easy to miss: without it,
      # webhook signature verification fails closed and every PayMongo event is
      # rejected with a 400, so online-paid sales sit at "pending" forever. Get
      # it from PayMongo dashboard -> Developers -> Webhooks -> Secret.
      #
      # - key: PAYMONGO_SECRET_KEY
      #   sync: false
      # - key: PAYMONGO_PUBLIC_KEY
      #   sync: false
      # - key: PAYMONGO_WEBHOOK_SECRET
      #   sync: false
      #
      # POS_FRONTEND_URL is normally NOT needed: PayMongo redirects default to the
      # origin the request arrived on, which is correct behind Render's proxy.
      # Only set it if the POS is served from a different public host than the API.
      #
      # - key: POS_FRONTEND_URL
      #   sync: false
      #
      # FRONTEND_URL is normally NOT needed: links inside emails (password reset,
      # payslips, contract notices, applicant status) are derived from the origin
      # the request arrived on. Set it only if emails should point elsewhere.
      #
      # - key: FRONTEND_URL
      #   sync: false
      #
      # Email (optional - password resets, payslips, receipts, contract notices).
      # Unset means sendEmail() drops every message and callers ignore the result,
      # so mail fails silently. The server logs "[MAILER] SMTP is not configured"
      # at boot when these are missing.
      #
      # For Gmail, SMTP_PASS must be an App Password (Google Account -> Security ->
      # 2-Step Verification -> App passwords), NOT the account password — a normal
      # password is rejected with "534-5.7.9 Invalid login".
      #
      # Note the variable is EMAIL_FROM (not MAIL_FROM).
      #
      # - key: SMTP_HOST
      #   value: smtp.gmail.com
      # - key: SMTP_PORT
      #   value: 587
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: EMAIL_FROM
      #   sync: false
    healthCheckPath: /health
    autoDeploy: true