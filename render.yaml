services:
  - type: web
    name: minimart-pos
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: |
      npm ci
      npm --prefix frontend ci && npm --prefix frontend run build
      npm --prefix frontend-hrms ci && npm --prefix frontend-hrms run build
    startCommand: node src/server.js
    # ── Storage (S2) ────────────────────────────────────────────────
    # Render's app filesystem is EPHEMERAL: every deploy — and every
    # scale-to-zero on a free instance — rebuilds it from git, so the SQLite
    # database, all uploads and the runtime settings file are wiped. Only a
    # persistent disk survives, and Render **does not allow disks on free
    # instances**: a blueprint that declares one with `plan: free` fails to
    # deploy, and if the /data paths below are set without an attached disk the
    # server cannot write to them at all (EACCES on /data/uploads/products).
    #
    # This file therefore ships the free-plan-safe default: no disk, no /data
    # paths — SQLite and uploads live in the app directory and reset on each
    # deploy. Fine for a demo; it is not durable storage.
    #
    # To persist data (recommended for real use):
    #   1. change `plan: free` above to `plan: starter` (or higher),
    #   2. uncomment the disk block and the UPLOAD_DIR / DB_STORAGE /
    #      SETTINGS_FILE env vars further down,
    #   3. redeploy. The volume is then mounted at /data and everything under
    #      it survives redeploys and restarts.
    # Alternative without a disk: DB_DIALECT=mysql with a Render MySQL/Postgres
    # service (the app supports both dialects).
    #
    # Either way the app now boots even when the volume is missing or not
    # writable: src/utils/storage.js falls back to a writable directory and
    # logs a loud [STORAGE] warning instead of crashing.
    #
    # disk:
    #   name: minimart-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── First-run admin (S1) ────────────────────────────────────────
      # AUTO_SETUP is intentionally NOT set in production: the weak demo
      # accounts (admin@minimart.com/admin123, hr@…/hr123, …) are dev-only.
      # On first boot with an EMPTY database the server creates exactly one
      # admin account:
      #   • from INITIAL_ADMIN_EMAIL + INITIAL_ADMIN_PASSWORD (12+ chars) if
      #     you set them as encrypted secrets in the Render dashboard, or
      #   • with a generated one-time password printed to the deploy logs
      #     exactly once.
      # Either way, first login is forced to change the password.
      # Set SEED_DEMO_ACCOUNTS=true only if you explicitly want the demo
      # store (and its demo logins) in production — not recommended.
      #
      # - key: INITIAL_ADMIN_EMAIL
      #   value: you@example.com
      # - key: INITIAL_ADMIN_PASSWORD
      #   sync: false
      - key: DB_DIALECT
        value: sqlite
      # Default paths (inside the app directory, reset on every deploy because
      # free instances have no disk). Uncomment these together with the disk
      # block above — and switch to a paid plan — to make them persistent:
      # - key: DB_STORAGE
      #   value: /data/database.sqlite
      # - key: UPLOAD_DIR
      #   value: /data/uploads
      # - key: SETTINGS_FILE
      #   value: /data/settings.json
      # ── Email (S1/A6c) ──────────────────────────────────────────────
      # Production refuses to boot without SMTP unless EMAIL_DISABLED=true
      # is set explicitly. Until you configure SMTP below, this opts out so
      # the deploy works; remove it once SMTP_* is set.
      - key: EMAIL_DISABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # CORS: leave unset. API + both frontends are served from the same
      # Render host, so the server defaults to same-origin-only (most secure).
      # Set CORS_ORIGIN=https://other-host.example.com only if you deploy a
      # frontend on a separate origin (or CORS_ORIGIN=* for an API-only,
      # cookie-less consumer).
      # - key: CORS_ORIGIN
      #   value: https://your-frontend.example.com
      # PayMongo (optional - only needed for online payments).
      # Set these in the Render dashboard as encrypted secrets, or uncomment and
      # fill them in. Do NOT commit real keys here.
      #
      # PAYMONGO_WEBHOOK_SECRET is the one that is easy to miss: without it,
      # webhook signature verification fails closed and every PayMongo event is
      # rejected with a 400, so online-paid sales sit at "pending" forever. Get
      # it from PayMongo dashboard -> Developers -> Webhooks -> Secret.
      #
      # - key: PAYMONGO_SECRET_KEY
      #   sync: false
      # - key: PAYMONGO_PUBLIC_KEY
      #   sync: false
      # - key: PAYMONGO_WEBHOOK_SECRET
      #   sync: false
      #
      # POS_FRONTEND_URL is normally NOT needed: PayMongo redirects default to the
      # origin the request arrived on, which is correct behind Render's proxy.
      # Only set it if the POS is served from a different public host than the API.
      #
      # - key: POS_FRONTEND_URL
      #   sync: false
      #
      # FRONTEND_URL is normally NOT needed: links inside emails (password reset,
      # payslips, contract notices, applicant status) are derived from the origin
      # the request arrived on. Set it only if emails should point elsewhere.
      #
      # - key: FRONTEND_URL
      #   sync: false
      #
      # Email (optional - password resets, payslips, receipts, contract notices).
      # Configure SMTP to enable outbound email, then remove EMAIL_DISABLED.
      #
      # For Gmail, SMTP_PASS must be an App Password (Google Account -> Security ->
      # 2-Step Verification -> App passwords), NOT the account password — a normal
      # password is rejected with "534-5.7.9 Invalid login".
      #
      # Note the variable is EMAIL_FROM (not MAIL_FROM).
      #
      # - key: SMTP_HOST
      #   value: smtp.gmail.com
      # - key: SMTP_PORT
      #   value: 587
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: EMAIL_FROM
      #   sync: false
    healthCheckPath: /health
    autoDeploy: true
