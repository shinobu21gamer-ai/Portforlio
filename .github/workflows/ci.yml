name: CI

on:
  push:
  pull_request:
    branches: [master, main, develop]
  schedule:
    - cron: '0 2 * * *'

env:
  NODE_ENV: test
  JWT_SECRET: test-jwt-secret-for-ci-only-32chars!!
  JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only-32chars
  DB_DIALECT: sqlite
  DB_STORAGE: ':memory:'
  AUTO_SETUP: 'true'
  EMAIL_DISABLED: 'true'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit + Integration (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          flags: sqlite

  build-frontends:
    name: Build Frontends
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend-hrms ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pos-dist
          path: frontend/dist/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: hrms-dist
          path: frontend-hrms/dist/
          retention-days: 1

  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build-frontends, test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/download-artifact@v4
        with:
          name: pos-dist
          path: frontend/dist
      - uses: actions/download-artifact@v4
        with:
          name: hrms-dist
          path: frontend-hrms/dist
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            docs/screenshots/
          retention-days: 7

  migration-test:
    name: Schema Migration (MySQL)
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: hrms_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run migration test against MySQL
        run: npm run test:migration
        env:
          TEST_MYSQL_PORT: '3306'
          TEST_MYSQL_DB: hrms_migration_test
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: ''
