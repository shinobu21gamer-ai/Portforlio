name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  schedule:
    - cron: '0 2 * * *'

# Supersede an older run for the same PR/branch, but never cancel a different
# branch's verification. This keeps queued Playwright/MySQL jobs from piling up.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  JWT_SECRET: test-jwt-secret-for-ci-only-32chars!!
  JWT_REFRESH_SECRET: test-refresh-secret-for-ci-only-32chars
  DB_DIALECT: sqlite
  DB_STORAGE: ':memory:'
  AUTO_SETUP: 'true'
  ALLOW_PUBLIC_REGISTRATION: 'false'
  EMAIL_DISABLED: 'true'
  APP_TIMEZONE: Asia/Manila

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Formatting remains a local/editor concern. ESLint is the CI quality gate.
      - run: npm run lint

  unit-test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Explicit directory means integration matrices do not run in this job.
      - run: npm run test:unit

  integration-test:
    name: Integration Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration

  # The global ratchet is intentionally measured over both disjoint suites.
  # Unit and integration jobs above give fast, non-overlapping failure signals;
  # this job produces the combined coverage artifact and enforces the ratchet.
  coverage:
    name: Coverage Ratchet
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    # Still emit an actionable combined report if either focused suite failed.
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  # The unit suite runs sync({force:true}), which rebuilds every table, so it can
  # never catch a broken migration — new columns and ENUM values always appear to
  # work. This job runs the migration helpers against a real pre-existing schema.
  # MariaDB is NOT used here on purpose: it accepts slightly different ENUM DDL
  # than the MySQL the app targets in production.
  migration-test:
    name: Schema Migration (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: hrms_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run migration test against MySQL
        run: npm run test:migration
        env:
          TEST_MYSQL_PORT: '3306'
          TEST_MYSQL_DB: hrms_migration_test
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: ''

  build-frontends:
    name: Build Frontends
    runs-on: ubuntu-latest
    needs: [lint, unit-test, integration-test, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend-hrms ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pos-dist
          path: frontend/dist/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: hrms-dist
          path: frontend-hrms/dist/
          retention-days: 1

  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build-frontends]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # The Express server serves both static applications, so download both
      # build outputs before Playwright starts npm run start:test.
      - uses: actions/download-artifact@v4
        with:
          name: pos-dist
          path: frontend/dist
      - uses: actions/download-artifact@v4
        with:
          name: hrms-dist
          path: frontend-hrms/dist
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5000
          EMAIL_DISABLED: 'true'
      - name: Upload Playwright report and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3

  deploy-staging:
    name: Deploy to Staging (Render)
    runs-on: ubuntu-latest
    needs: [lint, unit-test, integration-test, coverage, migration-test, build-frontends, e2e-test, security-audit]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not configured; skipping staging deploy."
            exit 0
          fi
          curl -sf -X POST "$RENDER_DEPLOY_HOOK_URL"
