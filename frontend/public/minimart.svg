<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Sky -->
  <rect width="800" height="600" fill="#FFF7ED"/>
  
  <!-- Sun -->
  <circle cx="650" cy="100" r="50" fill="#FCD34D" opacity="0.8"/>
  
  <!-- Clouds -->
  <g opacity="0.4">
    <ellipse cx="150" cy="80" rx="60" ry="25" fill="white"/>
    <ellipse cx="180" cy="75" rx="50" ry="20" fill="white"/>
    <ellipse cx="500" cy="120" rx="55" ry="22" fill="white"/>
    <ellipse cx="530" cy="115" rx="45" ry="18" fill="white"/>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="420" width="800" height="180" fill="#D1D5DB"/>
  <rect x="0" y="420" width="800" height="8" fill="#9CA3AF"/>
  
  <!-- Road -->
  <rect x="0" y="480" width="800" height="60" fill="#6B7280"/>
  <line x1="0" y1="510" x2="800" y2="510" stroke="#FCD34D" stroke-width="3" stroke-dasharray="20,15"/>
  
  <!-- Parking lot -->
  <rect x="180" y="440" width="440" height="40" fill="#9CA3AF" rx="4"/>
  <rect x="220" y="445" width="60" height="30" fill="#D1D5DB" rx="2" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="320" y="445" width="60" height="30" fill="#D1D5DB" rx="2" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="420" y="445" width="60" height="30" fill="#D1D5DB" rx="2" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="520" y="445" width="60" height="30" fill="#D1D5DB" rx="2" stroke="#9CA3AF" stroke-width="1"/>
  
  <!-- Store Building - Main structure -->
  <rect x="200" y="180" width="400" height="260" fill="#FFFFFF" rx="8"/>
  <rect x="200" y="180" width="400" height="260" stroke="#E5E7EB" stroke-width="2" rx="8"/>
  
  <!-- Store Roof/Awning -->
  <rect x="180" y="160" width="440" height="30" fill="#F97316" rx="6"/>
  <rect x="180" y="185" width="440" height="8" fill="#EA580C" rx="2"/>
  
  <!-- Store Sign -->
  <rect x="280" y="120" width="240" height="50" fill="#1F2937" rx="10"/>
  <text x="400" y="153" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#F97316">MINIMART</text>
  
  <!-- Shopping Cart Icon on Sign -->
  <g transform="translate(315,133) scale(0.5)">
    <circle cx="10" cy="30" r="3" fill="#F97316"/>
    <circle cx="30" cy="30" r="3" fill="#F97316"/>
    <path d="M5,5 L8,5 L12,20 L28,20" stroke="#F97316" stroke-width="2" fill="none"/>
    <path d="M10,10 L30,10 L27,17 L13,17 Z" fill="#F97316" opacity="0.3"/>
  </g>
  
  <!-- Windows -->
  <rect x="220" y="210" width="110" height="100" fill="#BFDBFE" rx="6" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="275" y1="210" x2="275" y2="310" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="220" y1="260" x2="330" y2="260" stroke="#D1D5DB" stroke-width="1"/>
  
  <rect x="470" y="210" width="110" height="100" fill="#BFDBFE" rx="6" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="525" y1="210" x2="525" y2="310" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="470" y1="260" x2="580" y2="260" stroke="#D1D5DB" stroke-width="1"/>
  
  <!-- Entrance Door -->
  <rect x="355" y="320" width="90" height="120" fill="#1F2937" rx="4"/>
  <rect x="360" y="325" width="80" height="110" fill="#374151" rx="3"/>
  <rect x="365" y="330" width="70" height="50" fill="#60A5FA" rx="2" opacity="0.6"/>
  <circle cx="432" cy="385" r="4" fill="#FCD34D"/>
  
  <!-- "OPEN" Sign -->
  <rect x="370" y="345" width="60" height="20" fill="#22C55E" rx="4"/>
  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">OPEN</text>
  
  <!-- Products visible through window (left) -->
  <rect x="225" y="270" width="20" height="15" fill="#EF4444" rx="2" opacity="0.7"/>
  <rect x="250" y="268" width="18" height="17" fill="#3B82F6" rx="2" opacity="0.7"/>
  <rect x="275" y="271" width="16" height="14" fill="#10B981" rx="2" opacity="0.7"/>
  <rect x="300" y="269" width="18" height="16" fill="#F59E0B" rx="2" opacity="0.7"/>
  
  <!-- Products visible through window (right) -->
  <rect x="475" y="270" width="18" height="15" fill="#8B5CF6" rx="2" opacity="0.7"/>
  <rect x="500" y="268" width="20" height="17" fill="#EC4899" rx="2" opacity="0.7"/>
  <rect x="528" y="271" width="16" height="14" fill="#F97316" rx="2" opacity="0.7"/>
  <rect x="552" y="269" width="18" height="16" fill="#06B6D4" rx="2" opacity="0.7"/>
  
  <!-- Side shelves (left window) -->
  <rect x="228" y="240" width="95" height="3" fill="#9CA3AF"/>
  <rect x="228" y="265" width="95" height="3" fill="#9CA3AF"/>
  
  <!-- Side shelves (right window) -->
  <rect x="473" y="240" width="95" height="3" fill="#9CA3AF"/>
  <rect x="473" y="265" width="95" height="3" fill="#9CA3AF"/>
  
  <!-- Decorative awning stripes -->
  <g opacity="0.15">
    <rect x="200" y="165" width="20" height="25" fill="white"/>
    <rect x="240" y="165" width="20" height="25" fill="white"/>
    <rect x="280" y="165" width="20" height="25" fill="white"/>
    <rect x="320" y="165" width="20" height="25" fill="white"/>
    <rect x="360" y="165" width="20" height="25" fill="white"/>
    <rect x="400" y="165" width="20" height="25" fill="white"/>
    <rect x="440" y="165" width="20" height="25" fill="white"/>
    <rect x="480" y="165" width="20" height="25" fill="white"/>
    <rect x="520" y="165" width="20" height="25" fill="white"/>
    <rect x="560" y="165" width="20" height="25" fill="white"/>
  </g>
  
  <!-- Trees/Bushes -->
  <ellipse cx="130" cy="390" rx="45" ry="50" fill="#22C55E" opacity="0.7"/>
  <rect x="125" y="400" width="10" height="30" fill="#92400E"/>
  <ellipse cx="670" cy="385" rx="50" ry="55" fill="#16A34A" opacity="0.7"/>
  <rect x="665" y="400" width="10" height="30" fill="#92400E"/>
  
  <!-- Small bush -->
  <ellipse cx="160" cy="420" rx="30" ry="20" fill="#4ADE80" opacity="0.6"/>
  <ellipse cx="640" cy="420" rx="28" ry="18" fill="#4ADE80" opacity="0.6"/>
  
  <!-- Shopping cart outside -->
  <g transform="translate(610,400) scale(0.8)">
    <circle cx="8" cy="28" r="3" fill="#6B7280"/>
    <circle cx="24" cy="28" r="3" fill="#6B7280"/>
    <path d="M3,3 L6,3 L9,18 L22,18" stroke="#6B7280" stroke-width="2" fill="none"/>
    <rect x="9" y="5" width="13" height="13" fill="#6B7280" opacity="0.3" rx="1"/>
  </g>
  
  <!-- Price tag -->
  <g transform="translate(155,350)">
    <rect width="40" height="25" fill="#FCD34D" rx="4"/>
    <text x="20" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F2937">SALE</text>
    <circle cx="35" cy="4" r="3" fill="#F97316"/>
  </g>
</svg>
